<div class="card-fb h-100">
  <div class="product-img" aria-hidden="true">🛒</div>
  <div class="p-3">
    <h3 class="h6 mb-1">{{ p.name }}</h3>
    <div class="price">₹{{ p.price }} <small class="text-muted fw-normal">/ {{ p.unit }}</small></div>
    {% if p.stock == 0 %}<span class="badge badge-out mt-2">Out of stock</span>
    {% elif p.stock <= 5 %}<span class="badge badge-stock mt-2">Only {{ p.stock }} left</span>{% endif %}
    <button class="btn btn-fb btn-sm w-100 mt-3" type="button" {% if p.stock == 0 %}disabled{% endif %}>Add to cart</button>
  </div>
</div>
